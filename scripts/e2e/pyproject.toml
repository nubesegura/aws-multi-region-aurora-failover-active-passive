# Tool configuration only: the DR drill runner is run from the repository with `python -m dr_drill`
# (from scripts/e2e), not installed as a wheel.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=dr_drill --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "N", "B", "S", "UP", "SIM", "I", "C4", "PT", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
