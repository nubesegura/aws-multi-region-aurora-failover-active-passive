# CI of the DR demo (requirement 8.1). Runs on every push and pull request; it never deploys and needs no AWS access.
# The commands are the same ones a developer runs locally (src/backend/README.md and the scripts under scripts/).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python (the Lambda runtime version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt
      - name: Install the backend tools and test dependencies
        run: python -m pip install -r src/backend/requirements-dev.txt
      - name: ruff check
        run: ruff check src/backend
      - name: ruff format --check
        run: ruff format --check src/backend
      - name: mypy --strict
        run: mypy --strict --config-file src/backend/pyproject.toml src/backend
      - name: import-linter
        run: PYTHONPATH=src/backend lint-imports --config src/backend/.importlinter
      - name: pytest with coverage (minimum 85 %)
        run: |
          pytest -c src/backend/pyproject.toml src/backend/tests --cov=dr_demo \
            --cov-config=src/backend/pyproject.toml --cov-fail-under=85
      - name: pytest (local runner, provision-users script; mocked, no AWS call)
        run: python -m pytest -q .github/workflows-local/provision-users/tests
      - name: pytest (local runner, failover authentication continuity; mocked, no AWS call)
        run: python -m pytest -q .github/workflows-local/tests

  drill-runner:
    name: drill runner (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/e2e/requirements-dev.txt
      - name: Install the runner tools and test dependencies
        run: python -m pip install -r scripts/e2e/requirements-dev.txt
      - name: ruff check and format
        run: |
          ruff check scripts/e2e
          ruff format --check scripts/e2e
      - name: mypy --strict
        run: mypy --strict --config-file scripts/e2e/pyproject.toml scripts/e2e/dr_drill
      - name: pytest with coverage (minimum 85 %; mocked, no AWS call, no network)
        run: python -m pytest -q scripts/e2e/tests

  dashboard:
    name: dashboard and JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: node --test (dashboard logic)
        working-directory: src/dashboard
        run: node --test
      - name: node --test (banking app logic)
        working-directory: src/bank
        run: node --test
      - name: node --check (JavaScript syntax)
        run: |
          node --check src/dashboard/app.js
          node --check src/dashboard/logic.js
          node --check src/bank/app.js
          node --check src/bank/logic.js
          node --check scripts/dashboard-mock.mjs
      - name: jq . (JSON syntax of the config, parameters and Postman files)
        run: |
          shopt -s nullglob
          for file in src/dashboard/config.json src/bank/config.json parameters/*.json postman/*.json; do
            echo "checking ${file}"
            jq . "${file}" > /dev/null
          done

  iac:
    name: templates (cfn-lint, sam validate, checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the IaC tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Install the pinned IaC tools
        run: python -m pip install -r .github/ci/requirements.txt
      - name: cfn-lint (all templates)
        run: cfn-lint templates/*.yaml
      - name: sam validate --lint (api, SAM) and database
        env:
          AWS_DEFAULT_REGION: us-east-2 # sam validate needs a region name; no AWS call is made
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam validate --lint --config-env prod-api
          sam validate --lint --config-env prod-database
      - name: Install the pinned checkov in its own environment (its boto3 pin conflicts with aws-sam-cli)
        run: |
          python -m venv "${RUNNER_TEMP}/checkov"
          "${RUNNER_TEMP}/checkov/bin/python" -m pip install -r .github/ci/requirements-checkov.txt
      - name: checkov (templates and workflows)
        run: |
          "${RUNNER_TEMP}/checkov/bin/checkov" -d templates --framework cloudformation --compact --quiet
          "${RUNNER_TEMP}/checkov/bin/checkov" -d .github/workflows --framework github_actions --compact --quiet
      - name: No internet gateway, NAT, address, endpoint or peering anywhere (design C32)
        run: |
          if grep -nE 'AWS::EC2::(InternetGateway|NatGateway|EIP|VPCEndpoint|VPCPeeringConnection|VPCGatewayAttachment)' templates/*.yaml; then
            echo "::error::a template declares a forbidden network resource (see the matches above)"
            exit 1
          fi

  scripts:
    name: scripts (shellcheck, bash -n, dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for shellcheck
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Install the pinned shellcheck
        run: python -m pip install "$(grep '^shellcheck-py==' .github/ci/requirements.txt)"
      - name: shellcheck
        run: |
          shopt -s globstar
          shellcheck -x scripts/**/*.sh
      - name: bash -n
        run: |
          shopt -s globstar
          for script in scripts/**/*.sh; do
            echo "checking ${script}"
            bash -n "${script}"
          done
      - name: --dry-run of every script (no AWS call; placeholder values only)
        env:
          AWS_REGION_PRIMARY: us-east-2
          AWS_REGION_SECONDARY: us-west-2
          AWS_REGION_GLOBAL: us-east-1
          API_DOMAIN_NAME: api.example.com
          HOSTED_ZONE_ID: Z0000000000000
          GITHUB_REPOSITORY: example/aws-multi-region-aurora-failover-active-passive
        run: |
          bash scripts/deploy.sh --dry-run > /dev/null
          bash scripts/init-schema.sh --dry-run > /dev/null
          bash scripts/publish-dashboard.sh --dry-run > /dev/null
          bash scripts/publish-bank.sh --dry-run > /dev/null
          bash scripts/destroy.sh --dry-run > /dev/null
          for script in scripts/dr/*.sh; do
            echo "dry-run of ${script}"
            bash "${script}" --dry-run > /dev/null
          done
      - name: 45-consistency.sh exit codes (stub curl on the PATH, no network)
        run: bash scripts/tests/test-45-consistency.sh
      - name: publish and destroy scripts (stub aws on the PATH, no AWS call)
        run: bash scripts/tests/test-publish.sh
      - name: Cognito deployment & teardown scripts (stub aws and sam on the PATH, no AWS call)
        run: bash scripts/tests/test-deploy-cognito.sh
      - name: lag gate of the planned switchover (stub aws on the PATH, no AWS call)
        run: bash scripts/tests/test-lag-gate.sh
      - name: run_parallel (jobs at the same time, labelled output, failures reported)
        run: bash scripts/tests/test-run-parallel.sh
      - name: No workflow forces a gate (no --force, --unplanned or FORCE_UNFENCE)
        run: |
          # ci.yml is excluded: it only names the flags in this check.
          # Comment lines may mention the flags (the workflow headers say they are never used).
          matches="$(grep -nE --exclude=ci.yml -- '--(force|unplanned)|FORCE_UNFENCE' .github/workflows/*.yml | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)"
          if [[ -n "${matches}" ]]; then
            echo "${matches}"
            echo "::error::a workflow passes --force, --unplanned or FORCE_UNFENCE to a script (see the matches above)"
            exit 1
          fi

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for actionlint
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Install the pinned actionlint and shellcheck
        run: |
          python -m pip install "$(grep '^actionlint-py==' .github/ci/requirements.txt)" \
            "$(grep '^shellcheck-py==' .github/ci/requirements.txt)"
      - name: actionlint
        run: actionlint
