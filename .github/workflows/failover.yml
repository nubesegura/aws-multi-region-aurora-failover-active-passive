# Failover workflow of the DR demo (requirements 9.1 to 9.7). Manual only. A PLANNED, zero-data-loss move of the demo
# between the two data regions, run from main against the prod stack. It never uses --force or --unplanned and never sets
# FORCE_UNFENCE: a failover after a real regional outage (unplanned, with possible data loss) stays a manual runbook step.
#
# direction = to-secondary
#   1. 00-precheck.sh (read only; the /stats baseline is skipped because no Cognito ID token is given to this step)
#   2. stops unless the primary region is fenced (run simulate-outage fence on the primary first) and the secondary region is NOT fenced
#   3. activate the Cognito replica in the secondary region (ReplicaAttachmentStatus=ACTIVE)
#   4. 20-promote.sh --yes          planned switchover of the global cluster to the secondary region
#   5. 30-switch-traffic.sh --to secondary
#   6. 40-validate.sh --expect-region <secondary> --wait 180 --probe   (the probe adds one deposit of 0.01)
#   7. 45-consistency.sh            the ledger replay must be consistent (exit 0; runs when a Cognito ID token is provided)
# direction = to-primary (requirement 9.3 as amended: fence lifted first, then database roles, then weights)
#   1. 10-simulate-outage.sh --undo --region <primary>   (unfence the primary)
#   2. 50-failback-promote.sh --yes  planned switchover back to the primary region
#   3. deactivate the Cognito replica in the secondary region (ReplicaAttachmentStatus=INACTIVE)
#   4. 30-switch-traffic.sh --to primary
#   5. 40-validate.sh --expect-region <primary> --wait 180 --probe
#   6. 45-consistency.sh
#
# Input confirm must be exactly: failover (requirement 9.7). The job refuses to run unless it was dispatched from main.
#
# UNDO: to-secondary is undone by running this workflow with direction to-primary, and the other way round. If a step
# fails, the job stops and leaves the state as it is; read the summary (writer region before and after) and the log
# before any new run.
#
# REQUIRED CONFIGURATION in the GitHub Environment "prod" (same names as deploy.yml; the first step fails with a clear
# message when something is missing):
#   Variables: AWS_REGION_PRIMARY AWS_REGION_SECONDARY AWS_REGION_GLOBAL API_DOMAIN_NAME HOSTED_ZONE_ID
#   Secrets:   AWS_ROLE_ARN
#   Authentication uses Amazon Cognito Multi-Region Replication (spec 002): user identity is verified via Bearer ID
#   tokens issued by regional Cognito User Pools (primary pool in AWS_REGION_PRIMARY, replica in AWS_REGION_SECONDARY).
#   AWS_REGION_GLOBAL (us-east-1) holds the bootstrap stack (execution role) and the dns stack.
#
# WARNING: the concurrency group drdemo-prod-infrastructure is shared with deploy, destroy and simulate-outage. GitHub keeps
# only one pending run per group: a deploy queued behind a running job can silently replace a queued failover (and the
# other way round). After dispatching, check the run list (Actions tab) and confirm that the run started.
#
# The deploy role session lasts one hour, so the work is split in three groups with a fresh OIDC login before each. The
# summary (direction, actor, time, seconds per step, writer region before and after, consistency result) is written to the
# job summary; it never contains a token or the account id.
name: failover

# checkov:skip=CKV_GHA_7: the inputs are typed controls of a failover drill (validated in the first step); they do not influence any build output
on:
  workflow_dispatch:
    inputs:
      direction:
        description: "to-secondary moves the service to the secondary region, to-primary moves it back"
        required: true
        type: choice
        options:
          - to-secondary
          - to-primary
      confirm:
        description: "Type failover to confirm"
        required: true
        type: string

permissions: {}

concurrency:
  group: drdemo-prod-infrastructure
  cancel-in-progress: false

jobs:
  failover:
    name: failover prod
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION_PRIMARY: ${{ vars.AWS_REGION_PRIMARY }}
      AWS_REGION_SECONDARY: ${{ vars.AWS_REGION_SECONDARY }}
      AWS_REGION_GLOBAL: ${{ vars.AWS_REGION_GLOBAL }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      INPUT_DIRECTION: ${{ inputs.direction }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Validate the branch, the inputs, the variables and the secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error title=Wrong branch::this workflow runs only from refs/heads/main (got ${GITHUB_REF//[^A-Za-z0-9_\/.-]/?})"
            exit 1
          fi
          missing=()
          for name in AWS_REGION_PRIMARY AWS_REGION_SECONDARY AWS_REGION_GLOBAL API_DOMAIN_NAME HOSTED_ZONE_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("variable ${name}"); fi
          done
          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then missing+=("secret AWS_ROLE_ARN"); fi
          if ((${#missing[@]} > 0)); then
            echo "::error title=Missing configuration in the prod environment::${missing[*]}"
            echo "The GitHub Environment 'prod' does not define:"
            printf '  - %s\n' "${missing[@]}"
            echo "Add them under Settings > Environments > prod (names and meaning: header of .github/workflows/deploy.yml)."
            exit 1
          fi
          case "${INPUT_DIRECTION}" in
            to-secondary | to-primary) ;;
            *)
              echo "::error title=Invalid input::direction must be to-secondary or to-primary"
              exit 1
              ;;
          esac
          if [[ "${INPUT_CONFIRM}" != "failover" ]]; then
            echo "::error title=Confirmation missing::the input 'confirm' must be exactly: failover"
            exit 1
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ >"${RUNNER_TEMP}/started-at"
          echo "Branch, inputs and configuration are in place."

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the step timer and the helper functions
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/dr-helpers.sh" <<'EOF'
          STEP_TIMINGS="${RUNNER_TEMP}/step-timings.tsv"

          # timed LABEL COMMAND... ; runs the command, appends "label<TAB>seconds<TAB>exit code" and returns its exit code.
          timed() {
            local label="$1" started rc=0
            shift
            started="$(date +%s)"
            "$@" || rc=$?
            printf '%s\t%s\t%s\n' "${label}" "$(($(date +%s) - started))" "${rc}" >>"${STEP_TIMINGS}"
            return "${rc}"
          }

          # verify_account ; the account id is read, masked and never printed.
          verify_account() {
            local id
            id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null)" || id=""
            if [[ ! "${id}" =~ ^[0-9]{12}$ ]]; then
              echo "::error title=AWS identity::sts get-caller-identity did not return an account; the OIDC login is not usable"
              return 1
            fi
            echo "::add-mask::${id}"
            echo "AWS identity verified (account id masked)."
          }

          # cognito_replica STATUS ; sets the regional attachment of the Cognito replica (ACTIVE or INACTIVE) through the
          # CloudFormation execution role (output of the bootstrap stack), as scripts/dr/30-switch-traffic.sh does for dns.
          cognito_replica() {
            local arn bootstrap_stack="stk-${AWS_REGION_GLOBAL//-/}-drdemo-bootstrap-prod"
            arn="$(aws cloudformation describe-stacks --region "${AWS_REGION_GLOBAL}" --stack-name "${bootstrap_stack}" \
              --query "Stacks[0].Outputs[?OutputKey=='CfnExecRoleArn'].OutputValue" --output text 2>/dev/null)" || arn=""
            if [[ "${arn}" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
              echo "::add-mask::${arn}"
              export CFN_EXEC_ROLE_ARN="${arn}"
            fi
            bash -c 'set -euo pipefail; source scripts/lib/common.sh; source scripts/lib/dr.sh; cognito_replica_set_status "$1"' _ "$1"
          }

          # writer_region ; prints the region of the writer member of the demo global cluster, or unknown.
          writer_region() {
            local cluster_a cluster_b region json out
            cluster_a="rdsc-${AWS_REGION_PRIMARY//-/}-drdemo-prod"
            cluster_b="rdsc-${AWS_REGION_SECONDARY//-/}-drdemo-prod"
            for region in "${AWS_REGION_PRIMARY}" "${AWS_REGION_SECONDARY}"; do
              json="$(aws --cli-connect-timeout 10 --cli-read-timeout 30 rds describe-global-clusters --region "${region}" --output json 2>/dev/null)" || continue
              out="$(jq -r --arg a ":cluster:${cluster_a}" --arg b ":cluster:${cluster_b}" \
                '[.GlobalClusters[] | select(any(.GlobalClusterMembers[]?; (.DBClusterArn | endswith($a)) or (.DBClusterArn | endswith($b))))]
                 | .[0] | [.GlobalClusterMembers[]? | select(.IsWriter == true) | (.DBClusterArn | split(":")[3])] | .[0] // empty' \
                <<<"${json}" 2>/dev/null)" || out=""
              if [[ "${out}" =~ ^[a-z0-9-]+$ ]]; then
                printf '%s' "${out}"
                return 0
              fi
            done
            printf 'unknown'
          }
          EOF
          : >"${RUNNER_TEMP}/step-timings.tsv"
          echo "Helpers written."

      - name: AWS login (group 1)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION_GLOBAL }}
          role-duration-seconds: 3600
      - name: Verify the AWS account (group 1)
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Verify the AWS account (group 1)" verify_account
      - name: Record the writer region before
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Writer region before" writer_region >"${RUNNER_TEMP}/writer-before"
          echo "Writer region before: $(cat "${RUNNER_TEMP}/writer-before")"
      - name: Group 1 - pre-checks (read only)
        if: inputs.direction == 'to-secondary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "00-precheck.sh" bash scripts/dr/00-precheck.sh
      - name: Group 1 - confirm that the primary region is fenced
        if: inputs.direction == 'to-secondary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          primary_is_fenced() {
            local out
            out="$(bash scripts/dr/10-simulate-outage.sh --status --region "${AWS_REGION_PRIMARY}")" || return 1
            printf '%s\n' "${out}"
            if ! grep -q ' is fenced: all ' <<<"${out}"; then
              echo "::error title=Primary region not fenced::run the workflow simulate-outage first (action fence, region ${AWS_REGION_PRIMARY}, confirm ${AWS_REGION_PRIMARY}), then dispatch this workflow again"
              return 1
            fi
          }
          timed "Primary region is fenced" primary_is_fenced
      - name: Group 1 - confirm that the secondary region is NOT fenced
        if: inputs.direction == 'to-secondary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          secondary_is_not_fenced() {
            local out
            out="$(bash scripts/dr/10-simulate-outage.sh --status --region "${AWS_REGION_SECONDARY}")" || true
            echo "${out}"
            if grep -qE 'reserved concurrency 0$' <<<"${out}"; then
              echo "::error title=Secondary region is fenced::a function of ${AWS_REGION_SECONDARY} has reserved concurrency 0; run simulate-outage (action unfence, region ${AWS_REGION_SECONDARY}) before moving traffic to it"
              return 1
            fi
          }
          timed "Secondary region is not fenced" secondary_is_not_fenced
      - name: Group 1 - unfence the primary region
        if: inputs.direction == 'to-primary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "10-simulate-outage.sh --undo (primary)" bash scripts/dr/10-simulate-outage.sh --undo --region "${AWS_REGION_PRIMARY}"

      - name: AWS login (group 2)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION_GLOBAL }}
          role-duration-seconds: 3600
      - name: Verify the AWS account (group 2)
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Verify the AWS account (group 2)" verify_account
      - name: Group 2 - activate the Cognito replica in the secondary region
        if: inputs.direction == 'to-secondary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Activate Cognito replica (${AWS_REGION_SECONDARY})" cognito_replica ACTIVE
      - name: Group 2 - planned switchover to the secondary region
        if: inputs.direction == 'to-secondary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "20-promote.sh --yes" bash scripts/dr/20-promote.sh --yes
      - name: Group 2 - planned switchover back to the primary region
        if: inputs.direction == 'to-primary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "50-failback-promote.sh --yes" bash scripts/dr/50-failback-promote.sh --yes
      - name: Group 2 - deactivate the Cognito replica in the secondary region
        if: inputs.direction == 'to-primary'
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Deactivate Cognito replica (${AWS_REGION_SECONDARY})" cognito_replica INACTIVE

      - name: AWS login (group 3)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION_GLOBAL }}
          role-duration-seconds: 3600
      - name: Verify the AWS account (group 3)
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          timed "Verify the AWS account (group 3)" verify_account
      - name: Group 3 - switch the Route 53 weights
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          # The dns stack is updated through the CloudFormation execution role (as deploy.sh does): its ARN is an output of the bootstrap stack.
          bootstrap_stack="stk-${AWS_REGION_GLOBAL//-/}-drdemo-bootstrap-prod"
          arn="$(aws cloudformation describe-stacks --region "${AWS_REGION_GLOBAL}" --stack-name "${bootstrap_stack}" \
            --query "Stacks[0].Outputs[?OutputKey=='CfnExecRoleArn'].OutputValue" --output text 2>/dev/null)" || arn=""
          if [[ "${arn}" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::add-mask::${arn}"
            export CFN_EXEC_ROLE_ARN="${arn}"
          else
            echo "::warning::CfnExecRoleArn not found in ${bootstrap_stack}; the dns stack is updated with the session role"
          fi
          if [[ "${INPUT_DIRECTION}" == "to-secondary" ]]; then target="secondary"; else target="primary"; fi
          timed "30-switch-traffic.sh --to ${target}" bash scripts/dr/30-switch-traffic.sh --to "${target}"
      - name: Group 3 - validate the service on the custom domain
        # Without COGNITO_ID_TOKEN the script verifies the serving region through GET /health?deep=true only.
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          if [[ "${INPUT_DIRECTION}" == "to-secondary" ]]; then expected="${AWS_REGION_SECONDARY}"; else expected="${AWS_REGION_PRIMARY}"; fi
          timed "40-validate.sh --expect-region ${expected}" bash scripts/dr/40-validate.sh --expect-region "${expected}" --wait 180 --probe
      - name: Group 3 - consistency check of the ledger
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/dr-helpers.sh"
          if [[ -n "${COGNITO_ID_TOKEN:-}" ]]; then
            timed "45-consistency.sh" bash scripts/dr/45-consistency.sh
          else
            echo "Skipping 45-consistency.sh in unauthenticated CI context (verified via Cognito Bearer token in drill)."
          fi

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          # shellcheck source=/dev/null
          [[ -f "${RUNNER_TEMP}/dr-helpers.sh" ]] && source "${RUNNER_TEMP}/dr-helpers.sh"
          safe() { if [[ "${1:-}" =~ ^[a-z0-9-]{1,40}$ ]]; then printf '%s' "$1"; else printf '(not valid)'; fi; }
          before="$(cat "${RUNNER_TEMP}/writer-before" 2>/dev/null || true)"
          after="unknown"
          if declare -F writer_region >/dev/null; then after="$(writer_region)"; fi
          consistency="not run"
          if [[ -f "${RUNNER_TEMP}/step-timings.tsv" ]]; then
            rc="$(awk -F'\t' '$1 == "45-consistency.sh" {print $3}' "${RUNNER_TEMP}/step-timings.tsv" | tail -n 1)"
            case "${rc}" in
              0) consistency="consistent" ;;
              1) consistency="INCONSISTENT (or no valid answer)" ;;
              2) consistency="truncated (nothing is claimed either way)" ;;
              "") ;;
              *) consistency="failed (exit ${rc})" ;;
            esac
          fi
          {
            echo "## failover"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Direction | $(safe "${INPUT_DIRECTION}") |"
            echo "| Regions | primary $(safe "${AWS_REGION_PRIMARY}"), secondary $(safe "${AWS_REGION_SECONDARY}") |"
            echo "| Actor | ${GITHUB_ACTOR} |"
            echo "| Started (UTC) | $(cat "${RUNNER_TEMP}/started-at" 2>/dev/null || echo not-started) |"
            echo "| Finished (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Writer region before | $(safe "${before:-unknown}") |"
            echo "| Writer region after | $(safe "${after}") |"
            echo "| Consistency check | ${consistency} |"
            echo
            echo "| Step | Seconds | Exit code |"
            echo "| --- | --- | --- |"
            if [[ -f "${RUNNER_TEMP}/step-timings.tsv" ]]; then
              while IFS=$'\t' read -r label secs rc; do
                echo "| ${label} | ${secs} | ${rc} |"
              done <"${RUNNER_TEMP}/step-timings.tsv"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
