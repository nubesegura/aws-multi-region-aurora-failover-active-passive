  GetAccountLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ['/aws/lambda/fnc-${RC}-drdemo-get-account-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  GetConsistencyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ['/aws/lambda/fnc-${RC}-drdemo-get-consistency-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  # ---------------------------------------------------------------- Function roles (one per function)
  # Each role: rds-db:connect on one database user of this cluster, log writes to its own log group, and the
  # Lambda VPC network interface actions (Resource "*" is required by Lambda, deviation D17).
  # No kms, secretsmanager, iam or sts actions.
  CreateTransactionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
      RoleName: !Sub ['iamr-${RC}-drdemo-create-transaction-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectAsWriterUser
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DbWriterUser}
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${CreateTransactionLogGroup.Arn}:*
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  ListTransactionsRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
      RoleName: !Sub ['iamr-${RC}-drdemo-list-transactions-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectAsReaderUser
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DbReaderUser}
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ListTransactionsLogGroup.Arn}:*
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  GetStatsRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
      RoleName: !Sub ['iamr-${RC}-drdemo-get-stats-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectAsReaderUser
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DbReaderUser}
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${GetStatsLogGroup.Arn}:*
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  GetHealthRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
      RoleName: !Sub ['iamr-${RC}-drdemo-get-health-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectAsReaderUser
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DbReaderUser}
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${GetHealthLogGroup.Arn}:*
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  GetAccountRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
