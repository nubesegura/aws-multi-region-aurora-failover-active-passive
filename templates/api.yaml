                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  GetConsistencyRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ec2 network interface actions need Resource * for VPC-attached Lambda functions (D17); every other statement is scoped to an ARN."
    Properties:
      RoleName: !Sub ['iamr-${RC}-drdemo-get-consistency-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectAsReaderUser
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DbReaderUser}
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${GetConsistencyLogGroup.Arn}:*
              - Sid: VpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  # ---------------------------------------------------------------- REST API
  Api:
    Type: AWS::Serverless::Api
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_73
            comment: "No X-Ray: the functions have no route to the X-Ray API from the private subnets (D14)."
          - id: CKV_AWS_120
            comment: "Caching is off on purpose: the stats and the health must always reflect the database and cache clusters bill per hour."
    Properties:
      Name: !Sub ['apig-${RC}-drdemo-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      StageName: !Ref EnvType
      OpenApiVersion: 3.0.1
      EndpointConfiguration:
        Type: REGIONAL
      DisableExecuteApiEndpoint: true
      TracingEnabled: false
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            Identity:
              Header: Authorization
      # A16 and gap G6: one static header cannot hold two origins, so the gateway layer (preflight and the errors the
      # gateway itself generates: missing/invalid token, throttle, fenced function) answers '*'. No cookies are used:
      # the Bearer token travels in the Authorization header. The functions echo the exact origin from ALLOWED_ORIGINS.
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type,Idempotency-Key'"
        MaxAge: "'600'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: '401'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        ACCESS_DENIED:
          StatusCode: '403'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        # No request or response bodies, no raw tokens (only verified caller sub and username claims, requirement 2.8).
        Format: '{"requestId":"$context.requestId","sourceIp":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","authorizerLatency":"$context.authorizer.latency","sub":"$context.authorizer.claims.sub","username":"$context.authorizer.claims.cognito:username","errorMessage":"$context.error.message"}'
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          LoggingLevel: ERROR
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref ThrottleRate
          ThrottlingBurstLimit: !Ref ThrottleBurst
      Tags:
        team-owner: nube-segura
        project-name: aws-multi-region-aurora-failover-active-passive
        app-name: dr-demo
        repo-name: aws-multi-region-aurora-failover-active-passive
        env-type: !Ref EnvType

  # Explicit regional Cognito User Pools Authorizer following naming convention apiga-<rc>-drdemo-cognito-<env>.
  CognitoUserPoolsAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub ['apiga-${RC}-drdemo-cognito-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      RestApiId: !Ref Api
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Ref CognitoUserPoolArn

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ['/aws/apigateway/apig-${RC}-drdemo-${EnvType}-access', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  # Execution log group created by API Gateway at ERROR level. Pre-created for retention, encryption and tags.
  ExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub API-Gateway-Execution-Logs_${Api}/${EnvType}
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  # ---------------------------------------------------------------- Custom domain and certificate
  # Both regions request a certificate for the same name; the DNS validation record is identical and is written to
  # the hosted zone by CloudFormation. Keep the record in place so ACM can renew the certificate.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType
        - Key: Name
          Value: !Sub ['acm-${RC}-drdemo-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]

  DomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref ApiDomainName
      RegionalCertificateArn: !Ref Certificate
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  BasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref DomainName
      RestApiId: !Ref Api
      Stage: !Ref Api.Stage

  # ---------------------------------------------------------------- Alarms
  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ['alrm-${RC}-drdemo-api-4xx-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      AlarmDescription: The API returned more than 25 client/authorizer errors (401/4XX) in 5 minutes. Check the access logs for unauthorized token attempts.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ['apig-${RC}-drdemo-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
        - Name: Stage
          Value: !Ref EnvType
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ['alrm-${RC}-drdemo-api-5xx-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      AlarmDescription: The API returned more than 5 server errors in 5 minutes. Check the function logs and the database state.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ['apig-${RC}-drdemo-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
        - Name: Stage
          Value: !Ref EnvType
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  # One alarm over the six functions (metric math) keeps the alarm count low.
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ['alrm-${RC}-drdemo-lambda-errors-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      AlarmDescription: The functions reported errors (sum of the six functions in 5 minutes). Check the function log groups.
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: Errors of all functions
          ReturnData: true
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CreateTransactionFunction
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListTransactionsFunction
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetStatsFunction
            Period: 300
            Stat: Sum
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetHealthFunction
            Period: 300
            Stat: Sum
        - Id: m5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetAccountFunction
            Period: 300
            Stat: Sum
        - Id: m6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetConsistencyFunction
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ['alrm-${RC}-drdemo-lambda-throttles-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      AlarmDescription: The functions were throttled (sum of the six functions in 5 minutes). Expected while the drill sets reserved concurrency to 0.
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: Throttles of all functions
          ReturnData: true
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CreateTransactionFunction
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListTransactionsFunction
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetStatsFunction
            Period: 300
            Stat: Sum
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetHealthFunction
            Period: 300
            Stat: Sum
        - Id: m5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetAccountFunction
            Period: 300
            Stat: Sum
        - Id: m6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetConsistencyFunction
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

  CertificateExpiryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ['alrm-${RC}-drdemo-cert-expiry-${EnvType}', {RC: !Join ['', !Split ['-', !Ref 'AWS::Region']]}]
      AlarmDescription: The API certificate expires in less than 30 days. Check that the DNS validation record still exists.
      Namespace: AWS/CertificateManager
      MetricName: DaysToExpiry
      Dimensions:
        - Name: CertificateArn
          Value: !Ref Certificate
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn
      Tags:
        - Key: team-owner
          Value: nube-segura
        - Key: project-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: app-name
          Value: dr-demo
        - Key: repo-name
          Value: aws-multi-region-aurora-failover-active-passive
        - Key: env-type
          Value: !Ref EnvType

Outputs:
  RegionalDomainName:
    Description: Regional domain name of the custom domain (target of the Route 53 alias).
    Value: !GetAtt DomainName.RegionalDomainName
  RegionalHostedZoneId:
    Description: Hosted zone id of the regional domain name (alias target zone).
    Value: !GetAtt DomainName.RegionalHostedZoneId
  ApiId:
    Description: REST API id.
    Value: !Ref Api
  CertificateArn:
    Description: ACM certificate of the custom domain.
    Value: !Ref Certificate
