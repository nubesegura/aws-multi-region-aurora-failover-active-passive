AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS DR demo - regional bootstrap stack (SAM artifact bucket, and in us-east-1 the GitHub OIDC deploy role and
  CloudFormation execution role).

# Design: security design review section 3.11 (D15, D17, D23, D25).

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W3037 # Cognito MRR IAM actions are newer than the bundled cfn-lint IAM schema.

Parameters:
  EnvType:
    Type: String
    Description: Environment tier.
    AllowedValues: [dev, prod]
    Default: prod
  CreateDeployRole:
    Type: String
    Description: Create the deploy role and execution role (true in us-east-1 only).
    AllowedValues: ["true", "false"]
    Default: "false"
  GitHubOrg:
    Type: String
    Description: GitHub organization or user.
    AllowedPattern: "^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$"
    ConstraintDescription: A GitHub owner name.
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"
    ConstraintDescription: A GitHub repository name.
  ExistingOidcProviderArn:
    Type: String
    Description: ARN of the GitHub OIDC provider. Required when CreateDeployRole is true.
    AllowedPattern: "^(arn:aws[a-z-]*:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com)?$"
    ConstraintDescription: Empty or the ARN of the token.actions.githubusercontent.com OIDC provider.
    Default: ""
  PermissionsBoundaryArn:
    Type: String
    Description: Optional permissions boundary ARN (D15).
    AllowedPattern: "^(arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+)?$"
    ConstraintDescription: Empty or the ARN of an IAM managed policy.
    Default: ""
  HostedZoneId:
    Type: String
    Description: Public hosted zone id. Required when CreateDeployRole is true.
    AllowedPattern: "^(Z[A-Z0-9]{5,31})?$"
    ConstraintDescription: Empty or a Route 53 hosted zone id.
    Default: ""
  AwsRegionGlobal:
    Type: String
    Description: Global stack region. Required when CreateDeployRole is true.
    AllowedPattern: "^([a-z]{2}-[a-z]+-[0-9])?$"
    ConstraintDescription: Empty or a region name.
    Default: ""
  AwsRegionPrimary:
    Type: String
    Description: Primary data region. Required when CreateDeployRole is true.
    AllowedPattern: "^([a-z]{2}-[a-z]+-[0-9])?$"
    ConstraintDescription: Empty or a region name.
    Default: ""
  AwsRegionSecondary:
    Type: String
    Description: Secondary data region. Required when CreateDeployRole is true.
    AllowedPattern: "^([a-z]{2}-[a-z]+-[0-9])?$"
    ConstraintDescription: Empty or a region name.
    Default: ""

Rules:
  DeployRoleNeedsScopeValues:
    RuleCondition: !Equals [!Ref CreateDeployRole, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: HostedZoneId is required when CreateDeployRole is true.
      - Assert: !Not [!Equals [!Ref AwsRegionGlobal, ""]]
        AssertDescription: AwsRegionGlobal is required when CreateDeployRole is true.
      - Assert: !Not [!Equals [!Ref AwsRegionPrimary, ""]]
        AssertDescription: AwsRegionPrimary is required when CreateDeployRole is true.
      - Assert: !Not [!Equals [!Ref AwsRegionSecondary, ""]]
        AssertDescription: AwsRegionSecondary is required when CreateDeployRole is true.
      - Assert: !Not [!Equals [!Ref ExistingOidcProviderArn, ""]]
        AssertDescription: ExistingOidcProviderArn is required when CreateDeployRole is true (account baseline).

Conditions:
  CreateRoles: !Equals [!Ref CreateDeployRole, "true"]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "D09 - no access logs; artifacts are reproducible from Git"
          - id: CKV_AWS_145
            comment: "SSE-KMS with the AWS managed key aws/s3 by design (security design review 3.5)"
          - id: CKV2_AWS_62
            comment: "No consumer of bucket events"
          - id: CKV_AWS_144
            comment: "No cross-region replication; artifacts are rebuilt from Git per region"
    Properties:
      BucketName: !Join
        - "-"
        - - bckt
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - artifacts
          - !Ref "AWS::AccountId"
          - !Ref EnvType
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: team-owner, Value: nube-segura }
        - { Key: project-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: app-name, Value: dr-demo }
        - { Key: repo-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: env-type, Value: !Ref EnvType }
        - { Key: sec-confidenciality, Value: internal }
        - { Key: sec-integrity, Value: tolerable-impact }
        - { Key: sec-avaliability, Value: tolerable-impact }
        - { Key: sec-domain, Value: na }
        - { Key: sec-pii, Value: na }
        - { Key: sec-compliance, Value: na }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DeployRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Join
        - "-"
        - - iamr
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - deploy
          - !Ref EnvType
      Description: GitHub Actions deploy role (OIDC, repository and environment pinned)
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:${EnvType}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${EnvType}"
      Tags:
        - { Key: team-owner, Value: nube-segura }
        - { Key: project-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: app-name, Value: dr-demo }
        - { Key: repo-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: env-type, Value: !Ref EnvType }

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRoles
    Properties:
      ManagedPolicyName: !Join
        - "-"
        - - iamp
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - deploy
          - !Ref EnvType
      Description: Permissions of the GitHub Actions deploy role
      Roles:
        - !Ref DeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationOnProjectStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListChangeSets
              - cloudformation:TagResource
              - cloudformation:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/stk-*-drdemo-*-${EnvType}/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionGlobal
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: CloudFormationSamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31"
          # Wildcard resource: ValidateTemplate has no resource-level permissions.
          - Sid: WildcardValidateTemplate
            Effect: Allow
            Action: cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: PassOnlyTheExecutionRoleToCloudFormation
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CfnExecRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: ArtifactBuckets
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-artifacts-${AWS::AccountId}-${EnvType}"
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-artifacts-${AWS::AccountId}-${EnvType}/*"
          - Sid: DashboardBucketPublishAndEmpty
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-dashboard-${AWS::AccountId}-${EnvType}"
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-dashboard-${AWS::AccountId}-${EnvType}/*"
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-bank-${AWS::AccountId}-${EnvType}"
              - !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-bank-${AWS::AccountId}-${EnvType}/*"
          - Sid: DashboardInvalidation
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
          # Wildcard resource: RDS Describe* calls do not support resource-level permissions for orderable options.
          - Sid: WildcardRdsReadOnly
            Effect: Allow
            Action:
              - rds:DescribeOrderableDBInstanceOptions
              - rds:DescribeDBEngineVersions
              - rds:DescribeGlobalClusters
              - rds:DescribeDBClusters
              - rds:DescribeDBInstances
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: DestroyClusterActions
            Effect: Allow
            Action:
              - rds:ModifyDBCluster
              - rds:RemoveFromGlobalCluster
            Resource: !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:rdsc-*-drdemo-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: DestroyGlobalClusterActions
            Effect: Allow
            Action:
              - rds:ModifyGlobalCluster
              - rds:RemoveFromGlobalCluster
            Resource: !Sub "arn:${AWS::Partition}:rds::${AWS::AccountId}:global-cluster:rdsg-*-drdemo-${EnvType}"
          - Sid: DrillSwitchoverGlobalCluster
            Effect: Allow
            Action: rds:SwitchoverGlobalCluster
            Resource:
              - !Sub "arn:${AWS::Partition}:rds::${AWS::AccountId}:global-cluster:rdsg-*-drdemo-${EnvType}"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:rdsc-*-drdemo-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: DrillLambdaConcurrencyFence
            Effect: Allow
            Action:
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunctionConcurrency
              - lambda:GetFunctionConfiguration
            Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:fnc-*-drdemo-*-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: GetMetricStatistics has no resource-level permissions.
          - Sid: WildcardCloudWatchGetMetricStatistics
            Effect: Allow
            Action: cloudwatch:GetMetricStatistics
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: SchemaBootstrapDataApi
            Effect: Allow
            Action: rds-data:ExecuteStatement
            Resource: !Sub "arn:${AWS::Partition}:rds:${AwsRegionPrimary}:${AWS::AccountId}:cluster:rdsc-*-drdemo-${EnvType}"
          - Sid: SchemaBootstrapReadMasterSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AwsRegionPrimary}:${AWS::AccountId}:secret:sm-*-drdemo-master-${EnvType}-*"
          - Sid: SchemaBootstrapDecryptMasterSecret
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AwsRegionPrimary}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AwsRegionPrimary}.amazonaws.com"
              ForAnyValue:StringLike:
                kms:ResourceAliases: !Sub "alias/kms-*-drdemo-*-${EnvType}"
          # Wildcard resource: read-only leftover listing has no resource-level scoping.
          - Sid: WildcardLeftoverListing
            Effect: Allow
            Action:
              - rds:DescribeDBClusterSnapshots
              - tag:GetResources
              - kms:DescribeKey
              - secretsmanager:ListSecrets
              - logs:DescribeLogGroups
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: LeftoverListingRecordSets
            Effect: Allow
            Action: route53:ListResourceRecordSets
            Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
          - Sid: CognitoDeployAndDestroyManagement
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - cognito-idp:UpdateUserPool
              - cognito-idp:UpdateUserPoolReplica
              - cognito-idp:ListUserPoolReplicas
              - cognito-idp:DescribeUserPool
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/drdemo/${EnvType}/cognito/*"
              - !Sub "arn:${AWS::Partition}:cognito-idp:*:${AWS::AccountId}:userpool/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary

  # ---------------------------------------------------------------------------------------------
  # CloudFormation execution role: creates the stacks' resources. Trusted only by CloudFormation.
  # ---------------------------------------------------------------------------------------------
  CfnExecRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Join
        - "-"
        - - iamr
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - cfnexec
          - !Ref EnvType
      Description: CloudFormation execution role for the project stacks (name, region and zone scoped)
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/stk-*-drdemo-*-${EnvType}/*"
      Tags:
        - { Key: team-owner, Value: nube-segura }
        - { Key: project-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: app-name, Value: dr-demo }
        - { Key: repo-name, Value: aws-multi-region-aurora-failover-active-passive }
        - { Key: env-type, Value: !Ref EnvType }

  # Part 1 of 4: network and database (stacks: database).
  CfnExecDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRoles
    Properties:
      ManagedPolicyName: !Join
        - "-"
        - - iamp
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - cfnexec-data
          - !Ref EnvType
      Description: Execution role permissions for VPC and Aurora resources
      Roles:
        - !Ref CfnExecRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Wildcard resource (D17-like): EC2 networking create/describe actions do not support resource-level
          # name scoping (the name is a tag). Limited by region and by an explicit action list (no internet
          # gateway, NAT, endpoint, peering or address actions: design constraint C32).
          - Sid: WildcardEc2Networking
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:UpdateSecurityGroupRuleDescriptionsIngress
              - ec2:UpdateSecurityGroupRuleDescriptionsEgress
              - ec2:ModifySecurityGroupRules
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:Describe*
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: RdsClusterAndInstance
            Effect: Allow
            Action:
              - rds:CreateDBCluster
              - rds:ModifyDBCluster
              - rds:EnableHttpEndpoint
              - rds:DisableHttpEndpoint
              - rds:DeleteDBCluster
              - rds:CreateDBInstance
              - rds:ModifyDBInstance
              - rds:DeleteDBInstance
              - rds:CreateDBSubnetGroup
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:CreateDBClusterParameterGroup
              - rds:ModifyDBClusterParameterGroup
              - rds:ResetDBClusterParameterGroup
              - rds:DeleteDBClusterParameterGroup
              - rds:CreateGlobalCluster
              - rds:ModifyGlobalCluster
              - rds:DeleteGlobalCluster
              - rds:RemoveFromGlobalCluster
              - rds:CrossRegionCommunication
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
              - rds:ListTagsForResource
              - rds:CreateDBClusterSnapshot
              - rds:AddRoleToDBCluster
            Resource:
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:rdsc-*-drdemo-${EnvType}"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:rds-*-drdemo-${EnvType}"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:subgrp:dbsg-*-drdemo-${EnvType}"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-pg:dbpg-*-drdemo-*-${EnvType}"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-snapshot:*"
              - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:default.aurora-postgresql*"
              - !Sub "arn:${AWS::Partition}:rds::${AWS::AccountId}:global-cluster:rdsg-*-drdemo-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: RDS Describe* and the Data API toggle read calls have no resource-level scoping.
          - Sid: WildcardRdsDescribe
            Effect: Allow
            Action: rds:Describe*
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Master secret of the primary cluster (database stack): the global database cannot use an RDS-managed secret.
          - Sid: DbMasterSecret
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:GetResourcePolicy
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AwsRegionPrimary}:${AWS::AccountId}:secret:sm-*-drdemo-master-${EnvType}-*"
          - Sid: DbMasterSecretRandomPassword
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AwsRegionPrimary
          - Sid: RdsServiceLinkedRole
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/cognito-idp.amazonaws.com/AWSServiceRoleForAmazonCognitoIdp*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/mrk.kms.amazonaws.com/AWSServiceRoleForKeyManagementServiceMultiRegionKeys"
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - rds.amazonaws.com
                  - cognito-idp.amazonaws.com
                  - mrk.kms.amazonaws.com

  CfnExecSecurityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRoles
    Properties:
      ManagedPolicyName: !Join
        - "-"
        - - iamp
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - cfnexec-security
          - !Ref EnvType
      Description: Execution role permissions for KMS, ACM and IAM roles of the project
      Roles:
        - !Ref CfnExecRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Wildcard resource: kms:CreateKey and kms:ReplicateKey cannot be scoped to a key that does not exist yet.
          - Sid: WildcardKmsCreateKey
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:ReplicateKey
              - kms:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: kms:ListAliases has no resource type; the AWS::KMS::Alias handler calls it (D17).
          - Sid: WildcardKmsListAliases
            Effect: Allow
            Action: kms:ListAliases
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: KmsKeyAdministration
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:EnableKeyRotation
              - kms:DisableKeyRotation
              - kms:EnableKey
              - kms:DisableKey
              - kms:UpdateKeyDescription
              - kms:ReplicateKey
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
              - kms:RetireGrant
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:ListResourceTags
            Resource: !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: KmsAliases
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:UpdateAlias
              - kms:DeleteAlias
            Resource:
              - !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:alias/kms-*-drdemo-*-${EnvType}"
              - !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: KmsGrantsForAwsServices
            Effect: Allow
            Action:
              - kms:CreateGrant
            Resource: !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
            Condition:
              Bool:
                kms:GrantIsForAWSResource: "true"
              StringLike:
                kms:ViaService:
                  - "rds.*.amazonaws.com"
                  - "secretsmanager.*.amazonaws.com"
                  - "sns.*.amazonaws.com"
                  - "cognito-idp.*.amazonaws.com"
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: KmsUseForAwsServices
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: acm:RequestCertificate has no resource type (the certificate does not exist yet).
          - Sid: WildcardAcmRequestCertificate
            Effect: Allow
            Action: acm:RequestCertificate
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: AcmCertificates
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:DeleteCertificate
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:ListTagsForCertificate
            Resource: !Sub "arn:${AWS::Partition}:acm:*:${AWS::AccountId}:certificate/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: ProjectRolesWithBoundary
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:AttachRolePolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-*-${EnvType}"
            Condition: !If
              - HasBoundary
              - StringEquals:
                  iam:PermissionsBoundary: !Ref PermissionsBoundaryArn
              - !Ref "AWS::NoValue"
          - Sid: ProjectRolesManage
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:DetachRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRoleTags
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-*-${EnvType}"
          # Only service-managed AWS policies for Lambda execution may be attached to project roles.
          - Sid: AttachOnlyLambdaExecutionPolicies
            Effect: Deny
            Action: iam:AttachRolePolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-*-${EnvType}"
            Condition:
              ArnNotEquals:
                iam:PolicyARN:
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          - Sid: PassProjectRolesToServices
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-*-${EnvType}"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - cognito-idp.amazonaws.com
          - Sid: DenyChangingTheDeploymentRoles
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-deploy-${EnvType}"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/iamr-*-drdemo-cfnexec-${EnvType}"
          # Resource "*" on a Deny only: nobody holding this policy may add or remove a boundary on any role.
          - Sid: DenyRemovingBoundaryFromProjectRoles
            Effect: Deny
            Action:
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
            Resource: "*"

  # Part 3 of 4: compute, API and observability (stacks: api, database alarms).
  CfnExecAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRoles
    Properties:
      ManagedPolicyName: !Join
        - "-"
        - - iamp
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - cfnexec-app
          - !Ref EnvType
      Description: Execution role permissions for Lambda, API Gateway, logs, alarms and topics
      Roles:
        - !Ref CfnExecRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The SAM transform runs with this role: it creates the change set on the transform itself.
          - Sid: SamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31"
          - Sid: LambdaFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionCodeSigningConfig
              # Read by the AWS::Lambda::Function handler after create and on every read (registry schema permissions).
              - lambda:GetRuntimeManagementConfig
              - lambda:GetFunctionRecursionConfig
              - lambda:GetFunctionScalingConfig
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:PublishVersion
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunctionConcurrency
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
            Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:fnc-*-drdemo-*-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # API Gateway control-plane ARNs carry no names (ids are generated), so scoping is by path type and region.
          - Sid: ApiGatewayManagement
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - !Sub "arn:${AWS::Partition}:apigateway:*::/restapis"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/restapis/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/domainnames"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/domainnames/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/usageplans"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/usageplans/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/apikeys"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/apikeys/*"
              - !Sub "arn:${AWS::Partition}:apigateway:*::/tags/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: LogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:AssociateKmsKey
              - logs:DisassociateKmsKey
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/fnc-*-drdemo-*-${EnvType}"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/fnc-*-drdemo-*-${EnvType}:*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/rds/cluster/rdsc-*-drdemo-${EnvType}/*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/rds/cluster/rdsc-*-drdemo-${EnvType}/*:*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:API-Gateway-Execution-Logs_*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:API-Gateway-Execution-Logs_*:*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/apigateway/*drdemo*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/apigateway/*drdemo*:*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: DescribeLogGroups does not support resource-level permissions.
          - Sid: WildcardLogsDescribe
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: SnsTopics
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:TagResource
              - sns:UntagResource
              - sns:ListTagsForResource
            Resource: !Sub "arn:${AWS::Partition}:sns:*:${AWS::AccountId}:sns-*-drdemo-*-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: CloudWatchAlarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:alrm-*-drdemo-*-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          # Wildcard resource: DescribeAlarms does not support resource-level permissions.
          - Sid: WildcardCloudWatchDescribe
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: ReadArtifactsForCodeAndTemplates
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-artifacts-${AWS::AccountId}-${EnvType}/*"
          # Wildcard resource: CreateUserPool and ListUserPoolReplicas cannot be scoped to a pool that does not exist yet.
          - Sid: WildcardCognitoCreateUserPool
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:ListUserPoolReplicas
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: CognitoUserPoolManagement
            Effect: Allow
            Action:
              - cognito-idp:DescribeUserPool
              - cognito-idp:UpdateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:CreateUserPoolReplica
              - cognito-idp:UpdateUserPoolReplica
              - cognito-idp:ListUserPoolReplicas
              - cognito-idp:DeleteUserPoolReplica
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:ListTagsForResource
            Resource:
              - !Sub "arn:${AWS::Partition}:cognito-idp:*:${AWS::AccountId}:userpool/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: CognitoSsmParameters
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/drdemo/${EnvType}/cognito/*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary

  # Part 4 of 4: global edge, DNS and buckets (stacks: edge, dns, bootstrap in data regions).
  CfnExecEdgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRoles
    Properties:
      ManagedPolicyName: !Join
        - "-"
        - - iamp
          - !Join ["", !Split ["-", !Ref "AWS::Region"]]
          - drdemo
          - cfnexec-edge
          - !Ref EnvType
      Description: Execution role permissions for S3 buckets, CloudFront and the one hosted zone
      Roles:
        - !Ref CfnExecRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProjectBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetBucketOwnershipControls
              - s3:PutBucketOwnershipControls
              - s3:GetBucketTagging
              - s3:PutBucketTagging
            Resource: !Sub "arn:${AWS::Partition}:s3:::bckt-*-drdemo-*-${AWS::AccountId}-${EnvType}"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - !Ref AwsRegionGlobal
                  - !Ref AwsRegionPrimary
                  - !Ref AwsRegionSecondary
          - Sid: CloudFrontDistributions
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:CreateDistributionWithTags
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
          - Sid: CloudFrontOriginAccessControl
            Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*"
          # Wildcard resource: response headers policy actions and the cache policy lookup used when a
          # distribution is created have no resource-level scoping in IAM.
          - Sid: WildcardCloudFrontPolicies
            Effect: Allow
            Action:
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:UpdateResponseHeadersPolicy
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:GetCachePolicy
              - cloudfront:ListCachePolicies
            Resource: "*"
          - Sid: Route53OneHostedZone
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
              - route53:GetHostedZone
            Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
          - Sid: Route53ChangeStatus
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub "arn:${AWS::Partition}:route53:::change/*"
          # Wildcard resource: route53:ListHostedZones has no resource type; the AWS::Route53::RecordSet handler calls it.
          - Sid: WildcardRoute53ListHostedZones
            Effect: Allow
            Action: route53:ListHostedZones
            Resource: "*"

Outputs:
  ArtifactBucketName:
    Description: SAM artifact bucket of this region.
    Value: !Ref ArtifactBucket
  DeployRoleArn:
    Condition: CreateRoles
    Description: Role that GitHub Actions assumes through OIDC.
    Value: !GetAtt DeployRole.Arn
  CfnExecRoleArn:
    Condition: CreateRoles
    Description: CloudFormation execution role passed with --role-arn.
    Value: !GetAtt CfnExecRole.Arn
